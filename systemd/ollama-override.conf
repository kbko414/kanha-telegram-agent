# Low-RAM tuning for the Ollama server.
# Installed by setup_tgagent.sh to /etc/systemd/system/ollama.service.d/override.conf
# (then: systemctl daemon-reload && systemctl restart ollama)
[Service]
# Unload the model 5 min after last use so RAM returns to other services.
Environment="OLLAMA_KEEP_ALIVE=5m"
# Only one model loaded, one request at a time.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# Less memory, faster attention.
Environment="OLLAMA_FLASH_ATTENTION=1"
# Half-size KV cache, minimal quality loss.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
